[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relic-sc"
version = "0.1.0"
description = "ReLiC-SC visual EEG retrieval with response prediction, calibration, and reliability-aware scoring"
requires-python = ">=3.11,<3.13"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
